<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f5c45">
    <title>Cadastro de Músicas</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Cadastro de Músicas</h1>
        <p>Gerencie o catálogo de músicas no sistema</p>
      </div>
    </header>

    <main class="container">
      <section class="painel">
        <h2 id="titulo-formulario">Nova Música</h2>

        <form id="form-musica">
          <input type="hidden" id="musica-id">

          <label for="titulo">Título da Música</label>
          <input id="titulo" name="titulo" type="text" placeholder="Ex: Anunciação" required>

          <label for="artista">Artista / Banda</label>
          <input id="artista" name="artista" type="text" placeholder="Ex: Alceu Valença" required>

          <label for="ano">Ano de Lançamento</label>
          <input id="ano" name="ano" type="number" min="1900" max="2026" placeholder="Ex: 1983">

          <label for="genero">Gênero Musical</label>
          <input id="genero" name="genero" type="text" placeholder="Ex: MPB, Rock, Pop">

          <div class="acoes-formulario">
            <button type="submit" id="botao-salvar">Cadastrar</button>
            <button type="button" id="botao-cancelar" class="secundario oculto">
              Cancelar edição
            </button>
          </div>
        </form>
      </section>

      <section class="painel">
        <div class="cabecalho-lista">
          <h2>Músicas Cadastradas</h2>
          <button type="button" id="botao-atualizar" class="secundario">Atualizar lista</button>
        </div>

        <form id="form-busca" class="busca">
          <label for="busca-id">Buscar música pelo ID</label>
          <div class="linha-busca">
            <input id="busca-id" type="text" placeholder="Informe o ID da música">
            <button type="submit">Buscar</button>
            <button type="button" id="botao-limpar-busca" class="secundario">Listar todas</button>
          </div>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>
        <div id="lista-musicas" class="lista-musicas"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
